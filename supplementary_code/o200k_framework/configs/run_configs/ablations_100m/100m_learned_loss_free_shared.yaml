run:
  profile: 100m
  dataset: fineweb
  tokenizer: ./tokenizer-o200k
  steps: 954
  batch_size: 256
  seq_len: 2048
  intermediate_size: 768
  shared_intermediate_size: 768
  bf16: true
  grad_ckpt: false
  eval_steps: 100
  eval_batches: 16
  log_steps: 10
  save_steps: 954
  save_total_limit: 2
  loss_chunk_tokens: 1024
  mlp_type: learned_router
  top_k: 2
  router_balance_mode: loss_free_bias
  router_aux_loss_coef: 0.0
  router_bias_update_rate: 0.001
  shared_expert: true
  learn_shared_routed_gates: true
  shared_gate_init: 1.0
  routed_gate_init: 0.5
  use_custom_kernels: auto
  cggr: false
  run_name: router-1b-100m_learned_loss_free_shared
  save_dir: checkpoints/router-1b-100m_learned_loss_free_shared
